name: build-macos-dmg

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build macOS app
        run: |
          PYI_ARGS=(
            main.py
            --noconfirm
            --clean
            --windowed
            --name cnn-dataset-annotation-tool
            --add-data "cnn_dataset_annotation_tool:cnn_dataset_annotation_tool"
          )

          if [ -d "datasets" ]; then
            PYI_ARGS+=(--add-data "datasets:datasets")
          fi

          if [ -d "resources" ]; then
            PYI_ARGS+=(--add-data "resources:resources")
          fi

          python -m PyInstaller "${PYI_ARGS[@]}"

      - name: Create DMG
        run: |
          mkdir -p dist/dmg-root
          cp -R "dist/cnn-dataset-annotation-tool.app" dist/dmg-root/
          hdiutil create \
            -volname "CNN Dataset Annotation Tool" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/cnn-dataset-annotation-tool.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/cnn-dataset-annotation-tool.dmg

      - name: Attach DMG to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/cnn-dataset-annotation-tool.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
